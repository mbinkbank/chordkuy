name = "chordkuy"
main = "worker.js"
compatibility_date = "2026-08-18"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# true = semua request lewat worker (array ["/sitemap.xml"] ternyata
# mematikan worker untuk path lain: SSR /chord/*, API, proxy ikut mati)
run_worker_first = true
