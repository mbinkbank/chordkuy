<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ChordLab — Chord Gitar Lengkap, Transpose &amp; Auto Scroll</title>
    <meta
      name="description"
      content="Kumpulan chord gitar dengan transpose real-time, auto scroll, dan diagram chord. Ringan, tanpa iklan mengganggu, dan nyaman dibaca di ponsel maupun desktop."
    />
    <meta name="theme-color" content="#101014" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="author" content="ChordLab" />
    <link rel="canonical" href="https://chordlab.pages.dev/" />

    <meta property="og:site_name" content="ChordLab" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:title" content="ChordLab — Chord Gitar Lengkap, Transpose &amp; Auto Scroll" />
    <meta
      property="og:description"
      content="Chord gitar bersih, cepat, dan enak dibaca. Transpose real-time, auto scroll, dan diagram chord."
    />
    <meta property="og:image" content="https://chordlab.pages.dev/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@chordlab" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600&family=Space+Grotesk:wght@400;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600&family=Space+Grotesk:wght@400;600&display=swap"
      />
    </noscript>

    <script>
      // Applied before paint so the theme never flashes.
      try {
        var t = localStorage.getItem("chordlab:theme");
        document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 16px; font-family: monospace">
        ChordLab menampilkan chord dan lirik dalam HTML. Aktifkan JavaScript untuk fitur transpose, auto
        scroll, dan diagram chord.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
