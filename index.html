<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Chordkuy — Chord Gitar Indonesia Lengkap dan Terupdate</title>
    <meta
      name="description"
      content="Kumpulan kunci gitar dan chord lagu Indonesia terlengkap. Temukan kunci gitar mudah untuk berbagai lagu populer, lengkap dengan lirik dan chord gitar."
    />
    <meta
      name="keywords"
      content="kunci gitar, chord gitar, kunci gitar lagu, chord lagu, kunci gitar mudah, chord gitar mudah, kunci gitar lengkap, chord gitar lengkap, kunci gitar Indonesia, chord lagu Indonesia"
    />
    <meta name="theme-color" content="#101014" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="google-site-verification" content="OCfi7vT9qKQoHxu_JBFTeVqL2auUp2fGUT8-fJvC3AY" />
    <meta name="author" content="Chorkuy" />
    <link rel="canonical" href="https://chordkuy.id" />

    <meta property="og:site_name" content="Chordkuy" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:title" content="Chordkuy — Chord Gitar Lengkap, Transpose &amp; Auto Scroll" />
    <meta
      property="og:description"
      content="Chord gitar bersih, cepat, dan enak dibaca. Transpose real-time, auto scroll, dan diagram chord."
    />
    <meta property="og:image" content="https://chordkuy.id/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@chordkuy" />

    <link rel="apple-touch-icon" href="/favicon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600&family=Space+Grotesk:wght@400;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600&family=Space+Grotesk:wght@400;600&display=swap"
      />
    </noscript>

    <script>
      // Applied before paint so the theme never flashes.
      try {
        var t = localStorage.getItem("chordlab:theme");
        document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
      } catch (e) {}
    </script>

    <div id="root"></div>
    <noscript>
      <p style="padding: 16px; font-family: monospace">
       chordkuy menampilkan chord dan lirik dalam HTML. Aktifkan JavaScript untuk fitur transpose, auto
        scroll, dan diagram chord.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
