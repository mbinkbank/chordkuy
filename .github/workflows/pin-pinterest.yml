name: Pin to Pinterest

on:
  schedule:
    - cron: "5 2 * * *"  # 09:05 WIB
    - cron: "5 7 * * *"  # 14:05 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install httpx

      - name: Pin to Pinterest
        working-directory: scraper
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PINS_PER_RUN: "5"
        run: python pin_to_pinterest.py

      - name: Commit pin history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scraper/pin_history.jsonl
          git commit -m "chore: pin history [skip ci]" || echo "No history change"
          git pull --rebase
          git push
