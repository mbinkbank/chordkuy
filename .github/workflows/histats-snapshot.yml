name: Histats Snapshot

on:
  schedule:
    - cron: "0 1,7,13,19 * * *" # 08:00, 14:00, 20:00, 02:00 WIB
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install puppeteer
        run: npm install puppeteer --no-save

      - name: Run Histats snapshot
        working-directory: scripts
        env:
          HISTATS_USER: ${{ secrets.HISTATS_USER }}
          HISTATS_PASS: ${{ secrets.HISTATS_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node histats-snapshot.mjs
