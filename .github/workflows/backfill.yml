name: Backfill Chordtela

on:
  schedule:
    - cron: "30 18 * * *" # 01:30 WIB
    - cron: "30 0 * * *"  # 07:30 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run backfill
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_PROXY_URL: "https://chordkuy.id"
          SCRAPE_PROXY_TOKEN: ${{ secrets.SCRAPE_PROXY_TOKEN }}
          BACKFILL_LIMIT: "800"
        run: python backfill.py

      - name: Commit backfill cursor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scraper/backfill_cursor.json
          git commit -m "chore: update backfill cursor [skip ci]" || echo "No cursor change"
          git push

