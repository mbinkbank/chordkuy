name: Rebuild Sitemap

on:
  repository_dispatch:
    types: [rebuild-sitemap]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy to Cloudflare
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Trigger Cloudflare Pages rebuild
        env:
          PAGES_HOOK: ${{ secrets.PAGES_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$PAGES_HOOK" ]; then
            curl -s -X POST "$PAGES_HOOK"
          else
            echo "PAGES_DEPLOY_HOOK_URL belum diset - skip"
          fi
